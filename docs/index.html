<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sora-OS | 軽快で洗練された次世代PC用OS</title>
  <style>
    :root {
      --bg-top: #eef4ff;
      --bg-bottom: #f8fafc;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--text-main);
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 60%, #e0f2fe 100%);
      min-height: 100vh;
      line-height: 1.65;
    }

    /* macOS風 上部メニューバー */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 36px;
      padding: 0 20px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      font-size: 13px;
      font-weight: 500;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-brand {
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .topbar a {
      color: var(--text-main);
      text-decoration: none;
      opacity: 0.85;
    }

    .topbar a:hover {
      opacity: 1;
      color: var(--accent);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    /* メインコンテナ */
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 56px 20px 110px;
    }

    /* ヒーロー */
    .hero {
      text-align: center;
      padding: 40px 24px 52px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    .hero p {
      max-width: 640px;
      margin: 0 auto 30px;
      color: var(--text-sub);
      font-size: 1.05rem;
    }

    .cta-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      padding: 14px 24px;
      border-radius: 14px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: transform 0.15s ease;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
    }

    /* ウィンドウモックアップ */
    .preview-window {
      margin: 12px auto 64px;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .window-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.55);
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    }

    .traffic {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }

    .window-title {
      margin-left: 8px;
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .window-body {
      padding: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 20px;
    }

    .card h3 {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    /* 手順・規約セクション */
    .section {
      margin-top: 48px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .section h2 {
      font-size: 1.4rem;
      margin-bottom: 18px;
      letter-spacing: -0.02em;
    }

    .steps {
      display: grid;
      gap: 14px;
      list-style: none;
    }

    .steps li {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      background: rgba(255, 255, 255, 0.7);
      padding: 16px;
      border-radius: 14px;
    }

    .step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notice {
      font-size: 0.92rem;
      color: var(--text-sub);
    }

    .notice ul {
      padding-left: 20px;
      margin-top: 8px;
    }

    .notice li + li {
      margin-top: 6px;
    }

    /* 下部Dock風ナビゲーション */
    .dock-wrap {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 90;
    }

    .dock {
      pointer-events: auto;
      display: flex;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.14);
      backdrop-filter: blur(18px);
    }

    .dock a {
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .dock a:hover {
      background: rgba(37, 99, 235, 0.12);
      color: var(--accent);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

    <div class="topbar-left">
      <span class="topbar-brand">Sora-OS</span>
      <a href="#features">特徴</a>
      <a href="#install">導入手順</a>
      <a href="#terms">利用規約</a>
    </div>
    <div class="topbar-right">
      <span class="status-pill"><span
